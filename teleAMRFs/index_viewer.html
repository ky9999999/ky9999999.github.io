    let currentIndex = events.findIndex(item => item.event === requestedEvent);
    if (currentIndex < 0) currentIndex = 0;

    function eventUrl(index) {
      return "?event=" + encodeURIComponent(events[index].event);
    }

    function setNavigation(link, index) {
      if (index < 0 || index >= events.length) {
        link.removeAttribute("href");
        link.classList.add("disabled");
      } else {
        link.href = eventUrl(index);
      }
    }

    if (events.length > 0) {
      const item = events[currentIndex];
      document.getElementById("event-title").textContent =
        item.time + "  M " + item.magnitude;
      document.getElementById("event-region").textContent = item.description;
      document.getElementById("direct-pdf").href = item.pdf;

      const previewLink = document.getElementById("preview-link");
      const previewImage = document.getElementById("preview-image");
      const pdfFrame = document.getElementById("pdf-frame");
      const previewError = document.getElementById("preview-error");
      if (item.preview) {
        // Public pages use a normal image. This avoids browser-specific PDF
        // plug-ins and also works in mobile browsers.
        previewLink.href = item.pdf;
        previewLink.style.display = "flex";
        pdfFrame.style.display = "none";
        previewImage.onerror = () => {
          previewLink.style.display = "none";
          previewError.style.display = "block";
        };
        previewImage.src = item.preview;
      } else {
        // The local viewer retains the original PDF. Give the plug-in the
        // full page width so that an open thumbnail sidebar cannot squeeze
        // the plotted page into a narrow column.
        pdfFrame.src = item.pdf + "#view=Fit&navpanes=0";
      }
      setNavigation(document.getElementById("newer"), currentIndex - 1);
      setNavigation(document.getElementById("older"), currentIndex + 1);
    } else {
      document.getElementById("event-title").textContent = "No AMRF results available";
      document.getElementById("newer").classList.add("disabled");
      document.getElementById("older").classList.add("disabled");
      document.getElementById("direct-pdf").classList.add("disabled");
    }

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft" && currentIndex > 0) {
        window.location.href = eventUrl(currentIndex - 1);
      }
      if (event.key === "ArrowRight" && currentIndex + 1 < events.length) {
        window.location.href = eventUrl(currentIndex + 1);
      }
    });
  </script>
